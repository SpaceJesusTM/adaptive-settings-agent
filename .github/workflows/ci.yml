name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OLLAMA_MODEL: ''
      PW_CHANNEL: chromium
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install --only-binary=:all: -r backend/requirements-dev.txt
      - name: Backend tests
        run: python -m pytest -c backend/pytest.ini
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend unit tests
        run: npm test
        working-directory: frontend
      - name: Frontend typecheck and build
        run: npm run build
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: frontend
      - name: Browser journeys
        run: npm run e2e
        working-directory: frontend
